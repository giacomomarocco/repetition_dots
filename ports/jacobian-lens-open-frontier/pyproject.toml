[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens"
version = "0.1.0"
description = "Companion code for 'Verbalizable Representations Form a Global Workspace in Language Models'"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "torch",
    "huggingface_hub",
    "transformers>=5.14",
    "numpy",
    # Required by `device_map=` in from_pretrained, i.e. by every multi-GPU fit.
    # A core dependency rather than an extra: a bare `uv run` re-syncs to the base
    # set, so anything parked in an extra gets uninstalled out from under a run.
    "accelerate>=1.0",
]

[project.urls]
Repository = "https://github.com/anthropics/jacobian-lens"
Paper = "https://transformer-circuits.pub/2026/workspace/index.html"

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15", "datasets>=4.8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# The replication scripts import in a deliberate order rather than a tidy one: the
# fp8 autograd formulas must be registered before the model is constructed, and the
# frozen-attention variant patches a transformers module before importing anything
# that would bind the unpatched function. Hoisting those imports would break the
# scripts, so E402 is not enforced there. Correctness rules (F, B, UP) still apply.
"experiments/**" = ["E402"]

[tool.setuptools]
packages = ["jlens"]

[tool.setuptools.package-data]
jlens = ["data/*"]
